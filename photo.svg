        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="150" fill="url(#figure)"/>
  <path d="M130 1000c10-250 130-360 270-360s260 110 270 360z" fill="url(#figure)"/>
  <rect width="800" height="1000" filter="url(#grain)" opacity="0.55"/>
